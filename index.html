<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocean WebGPU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <span id="fps">-- fps</span>
    <span id="mode"></span>
    <span class="hint"><span id="lookhint">click to look around</span> · WASD move · Space jump / up · C down · Shift run · F walk/fly · wheel fly speed · H hide UI</span>
  </div>

  <aside id="panel">
    <header>
      <h1>Ocean</h1>
      <button id="toggle" title="Collapse">–</button>
    </header>
    <div id="controls"></div>
  </aside>

  <div id="error" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
