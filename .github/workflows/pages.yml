name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/wizardly-clarke-p4rpo1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css src _site/
          # Cache-bust: give every module URL the commit hash so browsers never mix old and new files.
          v=${GITHUB_SHA::8}
          sed -i "s#src/main.js#src/main.js?v=$v#; s#style.css#style.css?v=$v#" _site/index.html
          find _site/src -name '*.js' -exec sed -i -E "s#(from '\./[^']+\.js)'#\1?v=$v'#g" {} +
          grep -rn "?v=" _site | head -5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
